<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	 <form method="post">

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
        </div>

        <div>
            <label>Gender:</label>

            <input type="radio" name="gender" id="gender_m" value="male" required>
            <label for="gender_m">Male</label>

            <input type="radio" name="gender" id="gender_f" value="female">
            <label for="gender_f">Female</label>
        </div>

        <div>
            <label for="cars">Cars:</label>

            <select name="car" id="cars">
                <option value="">--Please choose an option--</option>
                <option value="BMW">BMW</option>
                <option value="Porsche">Porsche</option>
                <option value="Kia">Kia</option>
                <option value="Range Rover">Range Rover</option>
            </select>
        </div>

        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Age" min="1" max="100">
        </div>

        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </div>

        <div>
            <label for="tel">Phone:</label>
            <input type="tel" name="phone" id="tel" placeholder="xxx-xxx-xxxx">
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>

        <div>
            <input type="checkbox" name="tos" id="tos" required>
            <label for="tos">I agree to TOS</label>
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>

    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
